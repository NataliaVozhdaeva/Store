name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EB_APPLICATION_NAME: OrganicStore
  EB_ENVIRONMENT_NAME: OrganicStore-env
  AWS_REGION: ap-southeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build front end
        run: |
          npm ci
          npm run build

      - name: Copy front end into wwwroot
        run: |
          rm -rf server/wwwroot
          mkdir -p server/wwwroot
          cp -r dist/* server/wwwroot/

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish back end
        run: dotnet publish server/server.csproj -c Release -o publish

      - name: Zip deployment package
        run: cd publish && zip -r ../deploy.zip . -x '*.pdb'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Прописывает провайдер БД, строку подключения и ключ шифрования как env vars
      # окружения Elastic Beanstalk при каждом деплое — не нужно настраивать это руками
      # в консоли AWS после пересоздания environment.
      - name: Configure Elastic Beanstalk environment variables
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --option-settings \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DatabaseProvider,Value=SqlServer \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=ConnectionStrings__DefaultConnection,Value="${{ secrets.AWS_SQLSERVER_CONNECTION_STRING }}" \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DATA_PROTECTION_KEY,Value="${{ secrets.DATA_PROTECTION_KEY }}"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: ${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: deploy.zip
