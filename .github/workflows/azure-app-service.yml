name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: OrganicStore
  # TODO: замените на реальное имя resource group в Azure (Portal -> App Service -> Overview -> Resource group)
  AZURE_RESOURCE_GROUP: organicRG

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build front end
        run: |
          npm ci
          npm run build

      - name: Copy front end into wwwroot
        run: |
          rm -rf server/wwwroot
          mkdir -p server/wwwroot
          cp -r dist/* server/wwwroot/

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish back end
        run: dotnet publish server/server.csproj -c Release -o publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Прописывает провайдер БД, строку подключения и ключ шифрования как application settings
      # App Service при каждом деплое — не нужно настраивать это руками в портале Azure
      # после пересоздания ресурса.
      - name: Configure App Service settings
        run: |
          az webapp config appsettings set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings \
              DatabaseProvider=SqlServer \
              ConnectionStrings__DefaultConnection="${{ secrets.AZURE_SQLSERVER_CONNECTION_STRING }}" \
              DATA_PROTECTION_KEY="${{ secrets.DATA_PROTECTION_KEY }}"
